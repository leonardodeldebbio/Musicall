name: Update Spotify dataset

on:
  schedule:
    - cron: "0 4 1 * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  KAGGLE_DATASET: "maharshipandya/-spotify-tracks-dataset"
  MIN_POPULARITY: "20"
  MAX_TRACKS: "100000"
  NEIGHBORS: "20"

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install "kaggle==2.2.5" six pandas numpy

      - name: Check Kaggle credentials
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          if [ -z "$KAGGLE_USERNAME" ] || [ -z "$KAGGLE_KEY" ]; then
            echo "Missing KAGGLE_USERNAME or KAGGLE_KEY repository secret."
            exit 1
          fi

      - name: Download dataset
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          set -euo pipefail
          rm -rf raw
          mkdir -p raw data
          kaggle datasets download -d "$KAGGLE_DATASET" -p raw --unzip
          find raw -type f -name "*.csv" -print

      - name: Filter and save CSV
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob
          import os
          import sys

          import pandas as pd

          files = glob.glob("raw/**/*.csv", recursive=True)
          if not files:
              sys.exit("No CSV file found in raw/")
          source = max(files, key=os.path.getsize)
          print(f"Reading {source}")

          df = pd.read_csv(source)
          df = df.drop(columns=[c for c in df.columns if c.startswith("Unnamed")])

          required = ["track_id", "popularity"]
          missing = [c for c in required if c not in df.columns]
          if missing:
              sys.exit(f"Missing columns: {missing}. Found: {list(df.columns)}")

          df = df.drop_duplicates(subset="track_id")
          df = df[df["popularity"] >= int(os.environ["MIN_POPULARITY"])]
          df = df.sort_values(["popularity", "track_id"], ascending=[False, True], kind="stable")
          df = df.head(int(os.environ["MAX_TRACKS"]))

          if df.empty:
              sys.exit("No tracks left after filtering")

          df.to_csv("data/tracks.csv", index=False)
          print(f"Tracks saved: {len(df)}")
          PY
          ls -lh data

      - name: Build recommendation data
        run: |
          set -euo pipefail
          rm -rf docs/data
          python build_recommendations.py
          ls -lh docs/data

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data docs/data
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update Spotify dataset ($(date -u +%Y-%m-%d))"
            git push
          fi
