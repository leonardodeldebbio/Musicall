name: Update Spotify dataset

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

env:
  KAGGLE_DATASET: "amitanshjoshi/spotify-1million-tracks"
  MIN_POPULARITY: "30"
  MAX_TRACKS: "200000"
  NEIGHBORS: "20"
  AUDIO_MAX_TRACKS: "100000"
  AUDIO_MINUTES: "240"
  ITUNES_MINUTES: "20"
  MAX_DOCS_MB: "400"
  MAX_FILE_MB: "90"
  MAX_REPO_MB: "700"

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check repository size
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          size_kb=$(gh api "repos/${GITHUB_REPOSITORY}" --jq .size || echo 0)
          size_mb=$((size_kb / 1024))
          echo "Repository size: ${size_mb} MB"
          if [ "$size_mb" -gt "$MAX_REPO_MB" ]; then
            echo "Repository exceeds ${MAX_REPO_MB} MB"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install "kaggle==2.2.5" six pandas numpy scipy "librosa==1.0.1" requests

      - name: Check Kaggle credentials
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          if [ -z "$KAGGLE_USERNAME" ] || [ -z "$KAGGLE_KEY" ]; then
            echo "Missing KAGGLE_USERNAME or KAGGLE_KEY repository secret."
            exit 1
          fi

      - name: Download dataset
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          set -euo pipefail
          rm -rf raw
          mkdir -p raw data
          kaggle datasets download -d "$KAGGLE_DATASET" -p raw --unzip
          find raw -type f -name "*.csv" -exec ls -lh {} \;

      - name: Filter and save CSV
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob
          import os
          import sys

          import pandas as pd

          OUT_COLUMNS = [
              "track_id", "artists", "album_name", "track_name", "popularity",
              "duration_ms", "explicit", "danceability", "energy", "key",
              "loudness", "mode", "speechiness", "acousticness",
              "instrumentalness", "liveness", "valence", "tempo",
              "time_signature", "track_genre", "year",
          ]
          FLOAT_COLUMNS = [
              "danceability", "energy", "loudness", "speechiness",
              "acousticness", "instrumentalness", "liveness", "valence", "tempo",
          ]
          RENAMES = {
              "artist_name": "artists",
              "artist": "artists",
              "genre": "track_genre",
              "id": "track_id",
              "name": "track_name",
              "album": "album_name",
          }

          files = glob.glob("raw/**/*.csv", recursive=True)
          if not files:
              sys.exit("No CSV file found in raw/")
          source = max(files, key=os.path.getsize)
          print(f"Reading {source}")

          df = pd.read_csv(source, low_memory=False)
          df = df.drop(columns=[c for c in df.columns if c.startswith("Unnamed")])
          df.columns = [c.strip().lower().replace(" ", "_") for c in df.columns]
          df = df.rename(columns=RENAMES)

          required = ["track_id", "track_name", "artists", "popularity"] + FLOAT_COLUMNS
          missing = [c for c in required if c not in df.columns]
          if missing:
              sys.exit(f"Missing columns: {missing}. Found: {list(df.columns)}")

          for column in OUT_COLUMNS:
              if column not in df.columns:
                  if column == "explicit":
                      df[column] = False
                  elif column == "year":
                      df[column] = float("nan")
                  else:
                      df[column] = ""
          df = df[OUT_COLUMNS]
          print(f"Rows before cleaning: {len(df)}")

          df["popularity"] = pd.to_numeric(df["popularity"], errors="coerce")
          df["year"] = pd.to_numeric(df["year"], errors="coerce")
          df[FLOAT_COLUMNS] = df[FLOAT_COLUMNS].apply(pd.to_numeric, errors="coerce")
          df = df.dropna(subset=["track_id", "track_name", "artists", "popularity"] + FLOAT_COLUMNS)

          df = df.sort_values(["popularity", "track_id"], ascending=[False, True], kind="stable")
          df = df.drop_duplicates(subset="track_id", keep="first")

          df["_key"] = (
              df["track_name"].astype(str).str.lower().str.strip()
              + "||"
              + df["artists"].astype(str).str.lower().str.strip()
          )
          df = df.drop_duplicates(subset="_key", keep="first").drop(columns="_key")

          df = df[df["popularity"] >= int(os.environ["MIN_POPULARITY"])]
          df = df.head(int(os.environ["MAX_TRACKS"]))

          if df.empty:
              sys.exit("No tracks left after filtering")

          df["popularity"] = df["popularity"].astype(int)
          df["year"] = df["year"].round().astype("Int64")
          df[FLOAT_COLUMNS] = df[FLOAT_COLUMNS].round(4)

          df.to_csv("data/tracks.csv", index=False)
          print(f"Tracks saved: {len(df)}")
          print(f"Popularity range: {df['popularity'].min()} - {df['popularity'].max()}")
          print(f"Genres: {df['track_genre'].nunique()}")
          PY
          ls -lh data

      - name: Fetch audio previews
        run: |
          set -euo pipefail
          mkdir -p cache/audio
          python -u fetch_previews.py

      - name: Commit audio cache
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cache/audio
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update audio cache ($(date -u +%Y-%m-%d))"
            git push
          fi

      - name: Build recommendation data
        run: |
          set -euo pipefail
          python -u build_recommendations.py
          ls -lh docs/data

      - name: Check size limits
        run: |
          set -euo pipefail
          total=$(du -sm docs/data | cut -f1)
          cache_total=$(du -sm cache | cut -f1)
          echo "docs/data total: ${total} MB, cache total: ${cache_total} MB"
          oversized=$(find docs/data cache -type f -size +"${MAX_FILE_MB}"M | head -n 1)
          if [ -n "$oversized" ]; then
            echo "File larger than ${MAX_FILE_MB} MB: $oversized"
            exit 1
          fi
          if [ "$total" -gt "$MAX_DOCS_MB" ]; then
            echo "docs/data exceeds ${MAX_DOCS_MB} MB, lower MAX_TRACKS or NEIGHBORS"
            exit 1
          fi

      - name: Commit changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -r -q --cached --ignore-unmatch data
          git add docs/data
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update Spotify dataset ($(date -u +%Y-%m-%d))"
            git push
          fi
